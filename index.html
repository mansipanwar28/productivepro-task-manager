<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProductivePro - Task Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-tasks"></i> ProductivePro</h1>
            <p>Your personal task management assistant</p>
        </div>
        
        <div class="app-controls">
            <input type="text" id="task-input" placeholder="Enter a new task...">
            <button id="add-btn"><i class="fas fa-plus"></i> Add</button>
        </div>
        
        <div class="filter-options">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        
        <div class="stats">
            <span id="total-tasks">Total: 0 tasks</span>
            <span id="completed-tasks">Completed: 0</span>
        </div>
        
        <ul class="task-list" id="task-list">
            <!-- Tasks will be added here dynamically -->
            <div class="empty-state" id="empty-state">
                <i class="fas fa-clipboard-list"></i>
                <p>No tasks yet. Add a task to get started!</p>
            </div>
        </ul>
        
        <div class="filter-options">
            <button id="clear-all">Clear Completed Tasks</button>
        </div>
        
        <footer>
            <p>ProductivePro | Made with <i class="fas fa-heart" style="color: #dc3545;"></i></p>
        </footer>
    </div> 
    <script src="script.js"></script>
</body>
</html>
